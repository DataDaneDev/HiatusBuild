<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590" role="img" aria-labelledby="title desc">
  <title id="title">Hiatus final 600 watt Arch Pro roof-solar layout</title>
  <desc id="desc">Measured 138 by 63 inch roof with centered MaxxAir, Starlink, four direct-bond Arch Pro panels, and two panels on one side cassette.</desc>
  <defs>
    <style>
      .t { font: 16px system-ui, sans-serif; fill: #17212b; }
      .s { font: 13px system-ui, sans-serif; fill: #17212b; }
      .tiny { font: 11px system-ui, sans-serif; fill: #17212b; }
      .roof { fill: #f7f8f9; stroke: #34495e; stroke-width: 3; }
      .track { stroke: #5b6770; stroke-width: 5; }
      .direct { fill: #c9ead8; stroke: #237a4b; stroke-width: 2; }
      .carrierpanel { fill: #f6d5a8; stroke: #b96900; stroke-width: 2; }
      .carrier { fill: none; stroke: #b96900; stroke-width: 3; stroke-dasharray: 8 5; }
      .fan { fill: #f5c6c6; stroke: #a53232; stroke-width: 2; }
      .star { fill: #c8ddf4; stroke: #2c67a0; stroke-width: 2; }
      .dim { stroke: #677783; stroke-width: 1.3; marker-start: url(#a); marker-end: url(#a); }
    </style>
    <marker id="a" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#677783"/></marker>
  </defs>

  <text x="90" y="38" class="t" font-weight="700">Final architecture: 6× BougeRV Arch Pro 100W = 600W, 3S2P, existing Victron 150/45</text>
  <text x="90" y="62" class="s">Measured skin 138×63 in · centered MaxxAir · 4 direct-bond panels · 2-panel removable side cassette · mirrorable left/right</text>

  <!-- Roof and tracks; 6 px per inch -->
  <rect x="90" y="130" width="828" height="378" rx="6" class="roof"/>
  <line x1="90" y1="130" x2="918" y2="130" class="track"/>
  <line x1="90" y1="508" x2="918" y2="508" class="track"/>

  <!-- Side cassette support envelope: X 3..93.8, Y -3.1..23 -->
  <rect x="108" y="111.4" width="544.8" height="156.6" rx="5" class="carrier"/>

  <!-- Carrier panels -->
  <rect x="114" y="117.4" width="229.8" height="144.6" rx="4" class="carrierpanel"/>
  <text x="124" y="141" class="s" font-weight="700">P1 · A · cassette</text>
  <text x="124" y="160" class="tiny">38.3×24.1</text>
  <rect x="417" y="117.4" width="229.8" height="144.6" rx="4" class="carrierpanel"/>
  <text x="427" y="141" class="s" font-weight="700">P5 · B · cassette</text>
  <text x="427" y="160" class="tiny">38.3×24.1</text>

  <!-- Fan and Starlink -->
  <rect x="264" y="268" width="204" height="102" rx="5" class="fan"/>
  <text x="280" y="306" class="s" font-weight="700">Centered MaxxAir keepout</text>
  <text x="280" y="328" class="tiny">X 29…63 · Y 23…40</text>
  <text x="280" y="346" class="tiny">rear-flange/open-lid field gate</text>

  <rect x="252.6" y="382" width="152.4" height="102.6" rx="5" class="star"/>
  <text x="267" y="416" class="s" font-weight="700">Starlink / TRIO</text>
  <text x="267" y="438" class="tiny">25.4×17.1 planning envelope</text>
  <text x="267" y="456" class="tiny">VHB discs + removable magnets</text>

  <!-- Direct panels -->
  <rect x="96" y="268" width="144.6" height="229.8" rx="4" class="direct"/>
  <text x="108" y="296" class="s" font-weight="700">P6 · A · direct</text>
  <text x="108" y="315" class="tiny">rotated</text>

  <rect x="474" y="268" width="144.6" height="229.8" rx="4" class="direct"/>
  <text x="486" y="296" class="s" font-weight="700">P3 · A · direct</text>
  <text x="486" y="315" class="tiny">rotated</text>

  <rect x="652.8" y="136" width="229.8" height="144.6" rx="4" class="direct"/>
  <text x="665" y="162" class="s" font-weight="700">P4 · B · direct</text>

  <rect x="624.6" y="357.4" width="229.8" height="144.6" rx="4" class="direct"/>
  <text x="637" y="383" class="s" font-weight="700">P2 · B · direct</text>

  <!-- Dimensions and legend -->
  <line x1="90" y1="535" x2="918" y2="535" class="dim"/>
  <text x="465" y="557" class="s">138 in front → rear</text>
  <line x1="946" y1="130" x2="946" y2="508" class="dim"/>
  <text x="957" y="326" class="s" transform="rotate(90 957 326)">63 in inside track-to-track</text>

  <rect x="90" y="78" width="16" height="16" class="direct"/><text x="114" y="91" class="s">direct bond</text>
  <rect x="225" y="78" width="16" height="16" class="carrierpanel"/><text x="249" y="91" class="s">side cassette</text>
  <rect x="370" y="78" width="16" height="16" class="fan"/><text x="394" y="91" class="s">fan keepout</text>
  <rect x="502" y="78" width="16" height="16" class="star"/><text x="526" y="91" class="s">Starlink</text>

  <text x="90" y="582" class="tiny">Release split: survey/templates/cassette weight budget before purchase; received labels, actual ≤75 lb, load proof, and hot commissioning before bonding/travel.</text>
</svg>
